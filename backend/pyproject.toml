[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberapply-backend"
version = "0.1.0"
description = "Local-first cybersecurity job application backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "SQLAlchemy>=2.0.36,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "PyJWT[crypto]>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "cryptography>=44",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "defusedxml>=0.7,<1", "celery[redis]>=5.5,<6",
  "pyotp>=2.9,<3", "qrcode>=8,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
