services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cyberapply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: cyberapply
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberapply -d cyberapply"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: .
      args:
        INSTALL_BROWSER: ${INSTALL_BROWSER:-false}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cyberapply:${POSTGRES_PASSWORD}@db:5432/cyberapply
      STORAGE_DIR: /srv/backend/data/documents
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - documents_data:/srv/backend/data
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    build:
      context: .
      args:
        INSTALL_BROWSER: ${INSTALL_BROWSER:-false}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cyberapply:${POSTGRES_PASSWORD}@db:5432/cyberapply
      STORAGE_DIR: /srv/backend/data/documents
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.workers"]
    volumes:
      - documents_data:/srv/backend/data
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
  documents_data:
